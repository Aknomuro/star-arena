[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-arena"
version = "0.4.1"
description = "STAR ARENA: GALACTIC CONQUEST — campagne spatiale avec Pygame CE"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5,<3"]

[project.scripts]
star-arena = "star_arena.app:main"

[tool.setuptools.packages.find]
where = ["src"]
